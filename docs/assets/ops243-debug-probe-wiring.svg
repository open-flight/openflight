<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">Raspberry Pi Debug Probe to Treedix breakout connections</title>
<desc id="desc">Colored arrows show the three connections from the Debug Probe D port: black to ordinary GND, yellow to SWIO, orange to CLK. The ribbon plug is seated in the breakout socket and connects to OPS243 J2. The unchanged side-view detail shows three soldered header pins with spacers above the board and solder underneath.</desc>
