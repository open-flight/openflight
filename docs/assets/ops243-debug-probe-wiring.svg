  <linearGradient id="case" x2="1" y2="1"><stop stop-color="#f7faf8" stop-opacity=".95"/><stop offset="1" stop-color="#d9e4df" stop-opacity=".9"/></linearGradient>
  <linearGradient id="plastic" x2="1" y2="1"><stop stop-color="#363c41"/><stop offset="1" stop-color="#13181c"/></linearGradient>
  <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#eff1f3"/><stop offset=".5" stop-color="#a5afb5"/><stop offset="1" stop-color="#d5dce0"/></linearGradient>
  <g id="pad"><circle r="11" fill="#c7a659" stroke="#e6cd8e" stroke-width="3"/><circle r="6" fill="#18271f"/></g>
  <g id="pin"><rect x="-4" y="-5" width="8" height="10" rx="1" fill="#e7c978" stroke="#ac8640"/></g>
  <g id="screw"><circle r="12" fill="#d4c793"/><circle r="7" fill="#f4f5f3" stroke="#a6aea9" stroke-width="2"/></g>
  <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#272c30"/></marker>
  <marker id="arrow-yellow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#bc941a"/></marker>
  <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#e87532"/></marker>
</defs>
