<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="930" viewBox="0 0 680 930" role="img">
<title>OPS243 UART wiring with the SEN-14262 sound trigger</title>
<desc>The OPS243 leaves USB and runs from the Raspberry Pi 5 header: 5V on J3 pin 9 to Pi pin 4, ground on J3 pin 10 to Pi pin 6, and a crossed UART pair on J3 pins 7 and 6 to Pi pins 10 and 8. The SEN-14262 sound detector runs on 3.3V from Pi pin 1 with ground on Pi pin 9, and its GATE output is spliced three ways, to J3 pin 3 (HOST_INT) and to Pi pin 11 (GPIO17). The OPS243 is drawn upside down, with its J3 header pins pointing up, pin 1 at the left and ground (pin 10) at the right, and the micro-USB connector on the same edge to the left of J3; the micro-USB stays unplugged. The Raspberry Pi 5 is rotated 90 degrees counter-clockwise so its USB ports face up and the GPIO header runs down its left edge with pin 1 at the bottom. Of its two ribbon connectors, CAM/DISP 1 is the one nearer the USB ports and takes the camera (dtoverlay=ov9281,cam1); CAM/DISP 0, below it, takes the Touch Display 2.</desc>
