<svg xmlns="http://www.w3.org/2000/svg" aria-label="Indoor specular vs outdoor diffuse reflection" role="img" viewBox="0 0 800 320" width="800" height="320">
<style>
  svg {
    --bg:#0a0a0f; --card:#12121a; --elev:#1a1a24; --hover:#222230;
    --gold:#d4af37; --gold-bright:#f4cf47; --gold-dim:#a68b2a;
    --cream:#f5f0e6; --cream-dim:rgba(245,240,230,.72);
    --cream-muted:rgba(245,240,230,.5);
    --ok:#4ade80; --info:#60a5fa; --warn:#fbbf24; --bad:#f87171;
    --line:rgba(245,240,230,.12);
    font-family: Outfit, "Helvetica Neue", Helvetica, system-ui, sans-serif;
  }
  .svg-lbl{fill:var(--cream-dim);font-size:13px}
  .svg-lbl-sm{fill:var(--cream-muted);font-size:11.5px}
  .svg-strong{fill:var(--cream);font-size:13px;font-weight:600}
  .svg-mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
</style>
<rect x="0" y="0" width="800" height="320" rx="8" fill="var(--bg)"/>

<!-- divider -->
<line stroke="var(--line)" stroke-width="1" x1="400" x2="400" y1="20" y2="300"></line>
<!-- INDOOR -->
<text class="svg-strong" fill="var(--ok)" text-anchor="middle" x="200" y="32">INDOOR · hard floor</text>
<line stroke="var(--ok)" stroke-width="3" x1="40" x2="360" y1="210" y2="210"></line>
<text class="svg-lbl-sm" text-anchor="middle" x="200" y="230">smooth → mirror-like (specular)</text>
<rect fill="var(--elev)" height="20" rx="3" stroke="var(--info)" stroke-width="1.3" width="30" x="50" y="190"></rect>
<circle cx="300" cy="90" fill="var(--gold-bright)" r="8"></circle>
<!-- one clean reflected ray -->
<line stroke="var(--bad)" stroke-width="2" x1="80" x2="200" y1="198" y2="210"></line>
<line stroke="var(--bad)" stroke-width="2" x1="200" x2="292" y1="210" y2="94"></line>
<circle cx="200" cy="210" fill="var(--bad)" r="3.5"></circle>
<line stroke="var(--ok)" stroke-width="2.5" x1="80" x2="292" y1="196" y2="86"></line>
<!-- sharp image -->
<circle cx="300" cy="286" fill="none" r="7" stroke="var(--bad)" stroke-width="2"></circle>
<text class="svg-lbl-sm" fill="var(--bad)" x="318" y="290">sharp image</text>
<text class="svg-strong" fill="var(--ok)" text-anchor="middle" x="200" y="262">maxsep ≈ 11°  ✓ separable</text>
<!-- OUTDOOR -->
<text class="svg-strong" fill="var(--warn)" text-anchor="middle" x="600" y="32">OUTDOOR · grass</text>
<path d="M440 210 l8 -7 l8 7 l8 -7 l8 7 l8 -7 l8 7 l8 -7 l8 7 l8 -7 l8 7 l8 -7 l8 7 l8 -7 l8 7 l8 -7 l8 7 l8 -7 l8 7 l8 -7 l8 7 l8 -7 l8 7 l8 -7 l8 7 l8 -7 l8 7 l8 -7 l8 7 l8 -7 l8 7" fill="none" stroke="var(--warn)" stroke-width="2"></path>
<text class="svg-lbl-sm" text-anchor="middle" x="600" y="232">rough → scattered (diffuse)</text>
<rect fill="var(--elev)" height="20" rx="3" stroke="var(--info)" stroke-width="1.3" width="30" x="450" y="190"></rect>
<circle cx="700" cy="90" fill="var(--gold-bright)" r="8"></circle>
<line stroke="var(--ok)" stroke-width="2.5" x1="480" x2="692" y1="196" y2="86"></line>
<!-- multiple scattered reflected rays -->
<g opacity=".6" stroke="var(--bad)" stroke-width="1.4">
<line x1="480" x2="690" y1="198" y2="100"></line>
<line x1="480" x2="700" y1="198" y2="120"></line>
<line x1="480" x2="710" y1="198" y2="108"></line>
<line x1="480" x2="695" y1="198" y2="135"></line>
</g>
<!-- smeared image -->
<ellipse cx="700" cy="280" fill="none" opacity=".7" rx="34" ry="14" stroke="var(--bad)" stroke-dasharray="4 4" stroke-width="1.6"></ellipse>
<text class="svg-lbl-sm" fill="var(--bad)" text-anchor="middle" x="700" y="284">smeared</text>
<text class="svg-strong" fill="var(--warn)" text-anchor="middle" x="600" y="262">maxsep ≈ 2.8°  ✗ collapses</text>
</svg>
