<svg xmlns="http://www.w3.org/2000/svg" aria-label="Radar setup geometry, drawn to scale" role="img" viewBox="0 0 800 372" width="800" height="372">
<style>
  svg {
    --bg:#0a0a0f; --card:#12121a; --elev:#1a1a24; --hover:#222230;
    --gold:#d4af37; --gold-bright:#f4cf47; --gold-dim:#a68b2a;
    --cream:#f5f0e6; --cream-dim:rgba(245,240,230,.72);
    --cream-muted:rgba(245,240,230,.5);
    --ok:#4ade80; --info:#60a5fa; --warn:#fbbf24; --bad:#f87171;
    --line:rgba(245,240,230,.12);
    font-family: Outfit, "Helvetica Neue", Helvetica, system-ui, sans-serif;
  }
  .svg-lbl{fill:var(--cream-dim);font-size:13px}
  .svg-lbl-sm{fill:var(--cream-muted);font-size:11.5px}
  .svg-strong{fill:var(--cream);font-size:13px;font-weight:600}
  .svg-mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
</style>
<rect x="0" y="0" width="800" height="372" rx="8" fill="var(--bg)"/>

<!-- drawn to scale: 40 px = 1 ft, equal on both axes, so the 16 degree launch reads true.
       radar at 0 ft (x=80) · tee/ball at 5 ft (x=280) · net at 15 ft (x=680) · range wrap 16.4 ft (x=736) -->
<!-- ground -->
<line stroke="var(--gold-dim)" stroke-width="2" x1="40" x2="792" y1="300" y2="300"></line>
<text class="svg-lbl-sm" x="44" y="318">floor / turf</text>
<!-- radar (sits slightly above the ball, as mounted) -->
<rect fill="var(--elev)" height="22" rx="3" stroke="var(--info)" stroke-width="1.5" width="40" x="60" y="278"></rect>
<text class="svg-strong" text-anchor="middle" x="80" y="270">radar</text>
<!-- boresight: radar aim at true 12.5 deg, drawn all the way to the net -->
<line opacity=".8" stroke="var(--info)" stroke-dasharray="6 5" stroke-width="1.3" x1="100" x2="680" y1="289" y2="160"></line>
<text class="svg-lbl-sm" fill="var(--info)" transform="rotate(-12.5 262 236)" x="262" y="236">boresight — radar aim ≈ 12.5°</text>
<!-- tee / ball at impact -->
<circle cx="280" cy="300" fill="var(--cream)" r="6"></circle>
<text class="svg-lbl-sm" text-anchor="middle" x="280" y="288">tee</text>
<!-- STRAIGHT flight line at 16 deg (a ball flies essentially straight over the first ~10 ft) -->
<line stroke="var(--gold)" stroke-width="2.5" x1="280" x2="752" y1="300" y2="165"></line>
<!-- the two usable frames (best case): 25 ms and 54 ms after impact, ~105 mph ball -->
<circle cx="428" cy="258" fill="var(--gold-bright)" r="6.5"></circle>
<circle cx="600" cy="208" fill="var(--gold-bright)" r="6.5"></circle>
<text class="svg-lbl-sm" fill="var(--gold)" text-anchor="end" x="424" y="246">frame 1 · 25 ms</text>
<text class="svg-lbl-sm" fill="var(--gold)" text-anchor="middle" x="600" y="194">frame 2 · 54 ms</text>
<!-- launch angle arc at the tee, measured from the ground (the true definition) -->
<line stroke="var(--cream-muted)" stroke-dasharray="3 3" stroke-width="1" x1="280" x2="356" y1="300" y2="300"></line>
<path d="M348 300 A 68 68 0 0 0 345 285" fill="none" stroke="var(--ok)" stroke-width="2"></path>
<text class="svg-strong" fill="var(--ok)" x="330" y="288">launch angle ≈ 16°</text>
<!-- net -->
<line stroke="var(--cream-muted)" stroke-dasharray="2 4" stroke-width="2" x1="680" x2="680" y1="300" y2="150"></line>
<text class="svg-lbl" x="688" y="158">net / screen</text>
<text class="svg-lbl-sm" x="688" y="175">10 ft from ball</text>
<text class="svg-lbl-sm" x="688" y="191">15 ft from radar</text>
<text class="svg-lbl-sm" x="688" y="207">radar setting: 5 m</text>
<!-- range-wrap tick at 16.4 ft -->
<line stroke="var(--bad)" stroke-width="1.5" x1="736" x2="736" y1="300" y2="286"></line>
<text class="svg-lbl-sm" fill="var(--bad)" x="744" y="296">16.4 ft — range wraps here</text>
<!-- dimension brackets -->
<g stroke="var(--cream-muted)" stroke-width="1">
<line x1="80" x2="80" y1="332" y2="324"></line><line x1="280" x2="280" y1="332" y2="324"></line>
<line x1="80" x2="280" y1="328" y2="328"></line>
<line x1="680" x2="680" y1="332" y2="324"></line>
<line x1="280" x2="280" y1="346" y2="324"></line><line x1="280" x2="680" y1="342" y2="342"></line>
</g>
<text class="svg-lbl-sm" text-anchor="middle" x="180" y="344">5 ft</text>
<text class="svg-lbl-sm" text-anchor="middle" x="480" y="358">10 ft</text>
</svg>
