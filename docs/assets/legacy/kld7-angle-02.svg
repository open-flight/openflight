<svg xmlns="http://www.w3.org/2000/svg" aria-label="Range sub-frames over time" role="img" viewBox="0 0 800 340" width="800" height="340">
<style>
  svg {
    --bg:#0a0a0f; --card:#12121a; --elev:#1a1a24; --hover:#222230;
    --gold:#d4af37; --gold-bright:#f4cf47; --gold-dim:#a68b2a;
    --cream:#f5f0e6; --cream-dim:rgba(245,240,230,.72);
    --cream-muted:rgba(245,240,230,.5);
    --ok:#4ade80; --info:#60a5fa; --warn:#fbbf24; --bad:#f87171;
    --line:rgba(245,240,230,.12);
    font-family: Outfit, "Helvetica Neue", Helvetica, system-ui, sans-serif;
  }
  .svg-lbl{fill:var(--cream-dim);font-size:13px}
  .svg-lbl-sm{fill:var(--cream-muted);font-size:11.5px}
  .svg-strong{fill:var(--cream);font-size:13px;font-weight:600}
  .svg-mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
</style>
<rect x="0" y="0" width="800" height="340" rx="8" fill="var(--bg)"/>

<line stroke="var(--cream-muted)" stroke-width="1.3" x1="115" x2="115" y1="58" y2="275"></line>
<line stroke="var(--cream-muted)" stroke-width="1.3" x1="115" x2="735" y1="275" y2="275"></line>
<text class="svg-lbl-sm" text-anchor="middle" transform="rotate(-90 34 166)" x="34" y="166">range (ft)</text>
<text class="svg-lbl-sm" text-anchor="middle" x="425" y="328">milliseconds after impact</text>
<text class="svg-lbl-sm" text-anchor="end" x="105" y="262">5</text>
<text class="svg-lbl-sm" text-anchor="end" x="105" y="176">10</text>
<text class="svg-lbl-sm" text-anchor="end" x="105" y="90">15</text>
<text class="svg-lbl-sm" text-anchor="middle" x="115" y="293">0</text>
<text class="svg-lbl-sm" text-anchor="middle" x="280" y="293">20</text>
<text class="svg-lbl-sm" text-anchor="middle" x="446" y="293">40</text>
<text class="svg-lbl-sm" text-anchor="middle" x="611" y="293">60</text>
<line opacity=".7" stroke="var(--bad)" stroke-dasharray="4 4" stroke-width="1" x1="115" x2="735" y1="61.4" y2="61.4"></line>
<text class="svg-lbl-sm" fill="var(--bad)" text-anchor="end" x="735" y="55.4">16.4 ft — range wraps above here</text>
<!-- two back-to-back frames (touching at the shared edge) -->
<rect fill="rgba(212,175,55,.06)" height="217" stroke="rgba(212,175,55,.30)" stroke-width="1" width="239.7" x="201.8" y="58"></rect>
<rect fill="rgba(212,175,55,.06)" height="217" stroke="rgba(212,175,55,.30)" stroke-width="1" width="239.7" x="441.5" y="58"></rect>
<text class="svg-lbl-sm" fill="var(--gold)" text-anchor="middle" x="322" y="52">frame 1 · ~29 ms</text>
<text class="svg-lbl-sm" fill="var(--gold)" text-anchor="middle" x="561" y="52">frame 2 · ~29 ms</text>
<text class="svg-lbl-sm" fill="var(--gold-dim)" text-anchor="middle" x="442" y="293">↑ frames touch</text>
<!-- fit line back to the tee -->
<line stroke="var(--ok)" stroke-dasharray="5 4" stroke-width="1.6" x1="115.0" x2="677.1" y1="257.8" y2="77.4"></line>
<line opacity=".6" stroke="var(--info)" stroke-dasharray="2 3" stroke-width="1" x1="115.0" x2="115.0" y1="275" y2="58"></line>
<circle cx="115.0" cy="257.8" fill="var(--cream)" r="5.5"></circle>
<text class="svg-strong" fill="var(--ok)" x="124" y="262">tee ≈ 5 ft = impact (t=0)</text>
<text class="svg-lbl-sm" fill="var(--ok)" text-anchor="end" x="673" y="69">fit + run back to tee</text>
<!-- sub-frame range dots -->
<circle cx="230.6" cy="220.7" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="245.8" cy="214.9" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="260.9" cy="211.8" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="276.1" cy="208.8" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="291.3" cy="202.6" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="306.5" cy="199.4" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="321.7" cy="191.3" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="336.8" cy="182.4" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="352.0" cy="183.3" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="367.2" cy="178.8" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="382.4" cy="170.5" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="397.6" cy="166.0" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="412.8" cy="161.9" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="470.3" cy="146.7" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="485.5" cy="139.0" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="500.7" cy="131.9" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="515.9" cy="133.3" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="531.0" cy="125.7" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="546.2" cy="125.3" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="561.4" cy="118.6" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="576.6" cy="115.4" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="591.8" cy="105.5" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="606.9" cy="103.9" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="622.1" cy="94.2" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="637.3" cy="89.7" fill="var(--gold-bright)" r="2.6"></circle>
<circle cx="652.5" cy="85.9" fill="var(--gold-bright)" r="2.6"></circle>
<!-- legend: range sub-divides, angle does not -->
<circle cx="588" cy="228" fill="var(--gold-bright)" r="3.2"></circle>
<text class="svg-lbl-sm" x="598" y="232">range — ~13 samples / frame</text>
<text class="svg-lbl-sm" fill="var(--cream-muted)" x="598" y="250">angle — one value / frame</text>
</svg>
