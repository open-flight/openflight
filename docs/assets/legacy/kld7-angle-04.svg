<svg xmlns="http://www.w3.org/2000/svg" aria-label="Range wrapping past 16.4 feet" role="img" viewBox="0 0 800 170" width="800" height="170">
<style>
  svg {
    --bg:#0a0a0f; --card:#12121a; --elev:#1a1a24; --hover:#222230;
    --gold:#d4af37; --gold-bright:#f4cf47; --gold-dim:#a68b2a;
    --cream:#f5f0e6; --cream-dim:rgba(245,240,230,.72);
    --cream-muted:rgba(245,240,230,.5);
    --ok:#4ade80; --info:#60a5fa; --warn:#fbbf24; --bad:#f87171;
    --line:rgba(245,240,230,.12);
    font-family: Outfit, "Helvetica Neue", Helvetica, system-ui, sans-serif;
  }
  .svg-lbl{fill:var(--cream-dim);font-size:13px}
  .svg-lbl-sm{fill:var(--cream-muted);font-size:11.5px}
  .svg-strong{fill:var(--cream);font-size:13px;font-weight:600}
  .svg-mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
</style>
<rect x="0" y="0" width="800" height="170" rx="8" fill="var(--bg)"/>

<!-- true axis -->
<line stroke="var(--cream-muted)" stroke-width="1.5" x1="40" x2="760" y1="60" y2="60"></line>
<text class="svg-lbl-sm" x="40" y="44">TRUE range</text>
<g class="svg-lbl-sm" fill="var(--cream-muted)" text-anchor="middle">
<text x="40" y="78">0</text><text x="400" y="78">16.4 ft</text><text x="620" y="78">23 ft</text>
</g>
<line stroke="var(--gold)" stroke-width="2" x1="400" x2="400" y1="52" y2="68"></line>
<circle cx="620" cy="60" fill="var(--gold-bright)" r="6"></circle>
<text class="svg-lbl" fill="var(--gold)" text-anchor="middle" x="620" y="36">real ball</text>
<!-- wrap arrow -->
<path d="M620 60 q -40 60 -110 60 q -100 0 -240 0" fill="none" marker-end="url(#arrB)" stroke="var(--bad)" stroke-dasharray="5 4" stroke-width="2"></path>
<!-- reported axis -->
<line stroke="var(--cream-muted)" stroke-width="1.5" x1="40" x2="760" y1="140" y2="140"></line>
<text class="svg-lbl-sm" x="40" y="160">what radar REPORTS</text>
<circle cx="270" cy="140" fill="var(--bad)" r="6"></circle>
<text class="svg-lbl" fill="var(--bad)" text-anchor="middle" x="270" y="128">"6.6 ft"</text>
<defs><marker id="arrB" markerHeight="9" markerWidth="9" orient="auto" refX="6" refY="4.5">
<path d="M0 0 L9 4.5 L0 9 z" fill="var(--bad)"></path></marker></defs>
</svg>
