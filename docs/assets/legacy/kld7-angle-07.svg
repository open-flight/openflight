<svg xmlns="http://www.w3.org/2000/svg" aria-label="Decomposition into ball and image components" role="img" viewBox="0 0 800 250" width="800" height="250">
<style>
  svg {
    --bg:#0a0a0f; --card:#12121a; --elev:#1a1a24; --hover:#222230;
    --gold:#d4af37; --gold-bright:#f4cf47; --gold-dim:#a68b2a;
    --cream:#f5f0e6; --cream-dim:rgba(245,240,230,.72);
    --cream-muted:rgba(245,240,230,.5);
    --ok:#4ade80; --info:#60a5fa; --warn:#fbbf24; --bad:#f87171;
    --line:rgba(245,240,230,.12);
    font-family: Outfit, "Helvetica Neue", Helvetica, system-ui, sans-serif;
  }
  .svg-lbl{fill:var(--cream-dim);font-size:13px}
  .svg-lbl-sm{fill:var(--cream-muted);font-size:11.5px}
  .svg-strong{fill:var(--cream);font-size:13px;font-weight:600}
  .svg-mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
</style>
<rect x="0" y="0" width="800" height="250" rx="8" fill="var(--bg)"/>

<!-- left: blended -->
<text class="svg-strong" text-anchor="middle" x="170" y="34">what the raw radar gives</text>
<line stroke="var(--cream-muted)" stroke-width="1.3" x1="60" x2="300" y1="200" y2="200"></line>
<circle cx="80" cy="200" fill="var(--cream)" r="5"></circle>
<line stroke="var(--warn)" stroke-width="3" x1="80" x2="270" y1="200" y2="150"></line>
<text class="svg-lbl" fill="var(--warn)" x="276" y="150">one blended angle</text>
<!-- arrow -->
<line marker-end="url(#arrG)" stroke="var(--gold)" stroke-width="2" x1="340" x2="430" y1="140" y2="140"></line>
<text class="svg-lbl-sm" fill="var(--gold)" text-anchor="middle" x="385" y="128">two-ray fit</text>
<defs><marker id="arrG" markerHeight="10" markerWidth="10" orient="auto" refX="7" refY="5">
<path d="M0 0 L10 5 L0 10 z" fill="var(--gold)"></path></marker></defs>
<!-- right: separated -->
<text class="svg-strong" text-anchor="middle" x="620" y="34">after separation</text>
<line stroke="var(--cream-muted)" stroke-width="1.3" x1="480" x2="760" y1="200" y2="200"></line>
<circle cx="500" cy="200" fill="var(--cream)" r="5"></circle>
<line stroke="var(--ok)" stroke-width="3" x1="500" x2="720" y1="200" y2="92"></line>
<text class="svg-lbl" fill="var(--ok)" x="726" y="92">ball</text>
<line stroke="var(--bad)" stroke-dasharray="4 3" stroke-width="2.5" x1="500" x2="720" y1="200" y2="174"></line>
<text class="svg-lbl" fill="var(--bad)" x="726" y="178">image</text>
<path d="M650 159 A 165 165 0 0 0 654 122" fill="none" stroke="var(--gold-bright)" stroke-width="2"></path>
<text class="svg-lbl" fill="var(--gold-bright)" text-anchor="end" x="600" y="150">maxsep</text>
</svg>
