<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img">
<title>IWR6843LEVM S1 boot switch: flashing vs functional mode</title>
<desc>The six-position CTS DIP switch S1 on the IWR6843LEVM as seen on the mounted board, with its markings drawn as they appear from this side, upside down: the lever numbers 6 to 1 run left to right along the top, so S1.1 is at the right end, and the bottom edge, next to the solder legs, reads CTS, 15 and ON, with ON under lever 1. The board silkscreen S1 sits beside the solder legs at the right. A lever pushed down, toward the ON print, is on. Flashing: S1.1 on, S1.2 off, S1.3 on, S1.4 on, S1.5 off. Functional: S1.1 off, S1.2 off, S1.3 on, S1.4 on, S1.5 off. Only S1.1 changes between the two. S1.6 is not used. RESET is the S2 push button.</desc>
<style>
  .ts { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; fill: #5F5E5A; }
  .th { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #3d3d3a; }
  .sw { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; fill: #E2D7B5; }
  .swb { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #F1E6C2; }
  .silk { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #A32D2D; }
</style>
<rect x="0" y="0" width="680" height="430" fill="#FFFFFF"/>
<text class="ts" x="410" y="26" text-anchor="middle" dominant-baseline="central">S1 as seen on the mounted board · markings upside down, as printed · down = ON</text>
