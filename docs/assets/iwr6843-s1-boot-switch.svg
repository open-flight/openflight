<rect x="532" y="106" width="32" height="26" rx="3" fill="#F4F3EE" stroke="#993C1D" stroke-width="2.5"/>
<text class="sw" x="292" y="147" text-anchor="middle" dominant-baseline="central" transform="rotate(180 292 147)">CTS</text>
<text class="sw" x="434" y="147" text-anchor="middle" dominant-baseline="central" transform="rotate(180 434 147)">15</text>
