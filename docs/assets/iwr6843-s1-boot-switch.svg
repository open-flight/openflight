<rect x="245" y="244" width="36" height="60" rx="3" fill="#1F1E1C"/>
<rect x="247" y="246" width="32" height="26" rx="3" fill="#F4F3EE" opacity="0.45"/>
<text class="sw" x="320" y="232" text-anchor="middle" dominant-baseline="central" transform="rotate(180 320 232)">5</text>
<rect x="302" y="244" width="36" height="60" rx="3" fill="#1F1E1C"/>
<rect x="304" y="246" width="32" height="26" rx="3" fill="#F4F3EE"/>
<text class="sw" x="377" y="232" text-anchor="middle" dominant-baseline="central" transform="rotate(180 377 232)">4</text>
<rect x="359" y="244" width="36" height="60" rx="3" fill="#1F1E1C"/>
<rect x="361" y="276" width="32" height="26" rx="3" fill="#F4F3EE"/>
<text class="sw" x="434" y="232" text-anchor="middle" dominant-baseline="central" transform="rotate(180 434 232)">3</text>
<rect x="416" y="244" width="36" height="60" rx="3" fill="#1F1E1C"/>
<rect x="418" y="276" width="32" height="26" rx="3" fill="#F4F3EE"/>
<text class="sw" x="491" y="232" text-anchor="middle" dominant-baseline="central" transform="rotate(180 491 232)">2</text>
<rect x="473" y="244" width="36" height="60" rx="3" fill="#1F1E1C"/>
<rect x="475" y="246" width="32" height="26" rx="3" fill="#F4F3EE"/>
<text class="swb" x="548" y="232" text-anchor="middle" dominant-baseline="central" transform="rotate(180 548 232)">1</text>
<rect x="530" y="244" width="36" height="60" rx="3" fill="#1F1E1C"/>
<rect x="532" y="246" width="32" height="26" rx="3" fill="#F4F3EE" stroke="#0F6E56" stroke-width="2.5"/>
<text class="sw" x="292" y="317" text-anchor="middle" dominant-baseline="central" transform="rotate(180 292 317)">CTS</text>
<text class="sw" x="434" y="317" text-anchor="middle" dominant-baseline="central" transform="rotate(180 434 317)">15</text>
<text class="swb" x="552" y="317" text-anchor="middle" dominant-baseline="central" transform="rotate(180 552 317)">ON</text>
<text class="silk" x="612" y="336" text-anchor="middle" dominant-baseline="central" transform="rotate(180 612 336)">S1</text>
<text class="ts" x="410" y="368" text-anchor="middle" dominant-baseline="central">Printed on the switch body: ON · 15 · CTS along one edge, 1–6 along the other.</text>
<text class="ts" x="410" y="388" text-anchor="middle" dominant-baseline="central">Only S1.1 (under ON, right end) changes. S1.6 is not used.</text>
<text class="ts" x="410" y="408" text-anchor="middle" dominant-baseline="central">After changing S1.1, press RESET (the S2 push button).</text>
</svg>
