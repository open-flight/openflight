<rect x="304" y="76" width="32" height="26" rx="3" fill="#F4F3EE"/>
<text class="sw" x="377" y="62" text-anchor="middle" dominant-baseline="central" transform="rotate(180 377 62)">4</text>
<rect x="359" y="74" width="36" height="60" rx="3" fill="#1F1E1C"/>
<rect x="361" y="106" width="32" height="26" rx="3" fill="#F4F3EE"/>
<text class="sw" x="434" y="62" text-anchor="middle" dominant-baseline="central" transform="rotate(180 434 62)">3</text>
