<text class="th" x="120" y="95" text-anchor="middle" dominant-baseline="central" style="fill:#712B13">Flashing</text>
<text class="ts" x="120" y="115" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">S1.1 ON</text>
<rect x="230" y="50" width="360" height="110" rx="6" fill="#3B3936"/>
