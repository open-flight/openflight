<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="186" viewBox="0 0 680 186" role="img">
<title>OPS243-A J3 header</title>
<desc>The OPS243-A J3 header viewed from the front, pin 1 on the left and ground (pin 10) on the right. Wired pins: 3 HOST_INT to the SEN-14262 GATE (spliced to Pi pin 11, GPIO17), 6 RxD to Pi pin 8, 7 TxD to Pi pin 10, 9 5V to Pi pin 4, 10 GND to Pi pin 6. Pins 1, 2, 4, 5 and 8 stay open; pin 4 is /RESET (active low).</desc>
<style>
  .ts { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; fill: #5F5E5A; }
  .th { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #3d3d3a; }
  .t { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; fill: #3d3d3a; }
</style>
<rect x="0" y="0" width="680" height="186" fill="#FFFFFF"/>
<g transform="translate(0,-660)">
<text class="th" x="340" y="684" text-anchor="middle" dominant-baseline="central">OPS243-A J3 · viewed from the front, GND rightmost</text>
<text class="ts" x="138" y="702" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="120" y="712" width="36" height="30" rx="4" fill="#F5F4EF" stroke="#B4B2A9" stroke-width="0.5"/><text class="ts" x="138" y="727" text-anchor="middle" dominant-baseline="central">IO</text>
<text class="ts" x="182" y="702" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="164" y="712" width="36" height="30" rx="4" fill="#F5F4EF" stroke="#B4B2A9" stroke-width="0.5"/><text class="ts" x="182" y="727" text-anchor="middle" dominant-baseline="central">IO</text>
<text class="ts" x="226" y="702" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="208" y="712" width="36" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text class="ts" x="226" y="727" text-anchor="middle" dominant-baseline="central" fill="#712B13">INT</text>
<rect x="216" y="750" width="20" height="8" rx="2" fill="#E8C21F" stroke="#73726C" stroke-width="0.5"/>
<text class="ts" x="226" y="774" text-anchor="middle" dominant-baseline="central">SEN GATE</text>
<text class="ts" x="270" y="702" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="252" y="712" width="36" height="30" rx="4" fill="#F5F4EF" stroke="#B4B2A9" stroke-width="0.5"/><text class="ts" x="270" y="727" text-anchor="middle" dominant-baseline="central">/RST</text>
<text class="ts" x="314" y="702" text-anchor="middle" dominant-baseline="central">5</text>
<rect x="296" y="712" width="36" height="30" rx="4" fill="#F5F4EF" stroke="#B4B2A9" stroke-width="0.5"/><text class="ts" x="314" y="727" text-anchor="middle" dominant-baseline="central">SEL</text>
<text class="ts" x="358" y="702" text-anchor="middle" dominant-baseline="central">6</text>
<rect x="340" y="712" width="36" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text class="ts" x="358" y="727" text-anchor="middle" dominant-baseline="central" fill="#712B13">RxD</text>
<rect x="348" y="750" width="20" height="8" rx="2" fill="#F57C00" stroke="#73726C" stroke-width="0.5"/>
<text class="ts" x="358" y="774" text-anchor="middle" dominant-baseline="central">Pi 8</text>
<text class="ts" x="402" y="702" text-anchor="middle" dominant-baseline="central">7</text>
<rect x="384" y="712" width="36" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text class="ts" x="402" y="727" text-anchor="middle" dominant-baseline="central" fill="#712B13">TxD</text>
<rect x="392" y="750" width="20" height="8" rx="2" fill="#F2C200" stroke="#73726C" stroke-width="0.5"/>
<text class="ts" x="402" y="774" text-anchor="middle" dominant-baseline="central">Pi 10</text>
<text class="ts" x="446" y="702" text-anchor="middle" dominant-baseline="central">8</text>
<rect x="428" y="712" width="36" height="30" rx="4" fill="#F5F4EF" stroke="#B4B2A9" stroke-width="0.5"/><text class="ts" x="446" y="727" text-anchor="middle" dominant-baseline="central">SCL</text>
<text class="ts" x="490" y="702" text-anchor="middle" dominant-baseline="central">9</text>
<rect x="472" y="712" width="36" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text class="ts" x="490" y="727" text-anchor="middle" dominant-baseline="central" fill="#712B13">5V</text>
<rect x="480" y="750" width="20" height="8" rx="2" fill="#8D5524" stroke="#73726C" stroke-width="0.5"/>
<text class="ts" x="490" y="774" text-anchor="middle" dominant-baseline="central">Pi 4</text>
<text class="ts" x="534" y="702" text-anchor="middle" dominant-baseline="central">10</text>
<rect x="516" y="712" width="36" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text class="ts" x="534" y="727" text-anchor="middle" dominant-baseline="central" fill="#712B13">GND</text>
<rect x="524" y="750" width="20" height="8" rx="2" fill="#D32F2F" stroke="#73726C" stroke-width="0.5"/>
<text class="ts" x="534" y="774" text-anchor="middle" dominant-baseline="central">Pi 6</text>
<text class="ts" x="340" y="800" text-anchor="middle" dominant-baseline="central">Leave 1, 2, 4, 5 and 8 open · pin 4 is /RESET (active low)</text>
</g>
<text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">Pin 3 (HOST_INT) takes the SEN-14262 GATE, spliced to Pi pin 11 (GPIO17).</text>
</svg>
