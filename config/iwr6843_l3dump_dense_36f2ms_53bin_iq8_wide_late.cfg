% Experimental profile: dense sampling with the wide profile's late window.
% 36 frames x 2 ms = 72 ms, 3 TX, 12 loops, 53-bin windows, IQ8 storage.
% Keeps all ball-phase frames in bins 47-99 to preserve slower-shot evidence
% while retaining the dense profile's capture and transfer timing.
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 2 1 0
captureFormat iq8
iq8Scale 128
phaseCaptureCfg 20 53 14 32 53 10 47 53 47 12 1
lowPower 0 0
sensorStart
