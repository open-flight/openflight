<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenFlight</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('openflight.theme');
          document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          var locale = localStorage.getItem('openflight.locale:v1');
          var langs = { en: 'en', es: 'es', fr: 'fr', pt: 'pt-BR' };
          if (langs[locale]) document.documentElement.lang = langs[locale];
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
